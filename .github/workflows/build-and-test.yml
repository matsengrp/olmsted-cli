name: build and test (skipped for drafts and unless rebased)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Superseded runs on the same PR are pointless; cancel them to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rebase-check-test-gate:
    # Draft PRs don't burn CI minutes; marking a PR ready for review runs CI.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if rebased on main
        id: check
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Branch is not rebased on latest main. Skipping build and test."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [rebase-check-test-gate]
    if: always() && (github.event_name == 'push' || needs.rebase-check-test-gate.outputs.should_run == 'true')
    strategy:
      matrix:
        os: [ubuntu-latest]
        # PRs test only the oldest supported Python (the floor that catches
        # accidental use of newer syntax); pushes to main test the full range.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.8"]') || fromJSON('["3.8", "3.12"]') }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv venv --python ${{ matrix.python-version }}

      # No lockfile: this resolves the pyproject.toml lower bounds fresh, the
      # way a user's `pip install olmsted-cli` would.
      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Check format
        run: uv run --no-sync ruff format --check .

      - name: Lint
        run: uv run --no-sync ruff check .

      # Tests invoke the `olmsted` entry point by name, so the venv's bin must
      # be on PATH; `uv run` puts it there.
      - name: Test
        run: uv run --no-sync pytest
